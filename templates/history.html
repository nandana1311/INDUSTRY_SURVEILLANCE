<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeGuard · Analysis History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --ink: #0b0c0e;
            --ink2: #23252a;
            --ink3: #454850;
            --muted: #868a94;
            --line: #e4e5e8;
            --line2: #d0d1d6;
            --bg: #f7f7f5;
            --surface: #ffffff;
            --surface2: #f2f2ef;
            --green: #1a9e5c;
            --green-bg: #edfaf3;
            --green-line: #a3e6c4;
            --red: #d93025;
            --red-bg: #fef0ee;
            --red-line: #f5b0aa;
            --amber: #c97c0a;
            --amber-bg: #fef8ec;
            --amber-line: #f5d98a;
            --blue: #1d5bdb;
            --blue-bg: #eef3ff;
            --blue-line: #afc6f8;
            --r: 10px;
            --r2: 16px;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh
        }

        /* HEADER */
        header {
            background: var(--ink);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .04em
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: #1a9e5c;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .logo-icon svg {
            width: 16px;
            height: 16px
        }

        .back-btn {
            font-size: 12px;
            color: rgba(255, 255, 255, .7);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .08);
            transition: .15s
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, .14);
            color: #fff
        }

        /* SHELL */
        .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px 60px
        }

        /* PAGE HEADER */
        .page-hd {
            margin-bottom: 28px
        }

        .page-hd h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px
        }

        .page-hd p {
            font-size: 13px;
            color: var(--muted)
        }

        /* LIST VIEW */
        .list-view {
            display: flex;
            flex-direction: column;
            gap: 0
        }

        .list-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-bottom: none;
            padding: 18px 22px;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            transition: background .1s;
        }

        .list-item:first-child {
            border-radius: var(--r2) var(--r2) 0 0
        }

        .list-item:last-child {
            border-bottom: 1px solid var(--line);
            border-radius: 0 0 var(--r2) var(--r2)
        }

        .list-item:only-child {
            border-radius: var(--r2);
            border-bottom: 1px solid var(--line)
        }

        .list-item:hover {
            background: var(--surface2)
        }

        .li-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .li-icon.img {
            background: var(--blue-bg)
        }

        .li-icon.vid {
            background: var(--amber-bg)
        }

        .li-icon svg {
            width: 18px;
            height: 18px
        }

        .li-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 3px;
            word-break: break-all
        }

        .li-time {
            font-size: 11px;
            color: var(--muted)
        }

        .li-stats {
            display: flex;
            gap: 16px;
            align-items: center
        }

        .li-stat {
            text-align: center
        }

        .li-stat .v {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            line-height: 1
        }

        .li-stat .l {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px
        }

        .li-stat.red .v {
            color: var(--red)
        }

        .li-stat.amber .v {
            color: var(--amber)
        }

        .li-stat.green .v {
            color: var(--green)
        }

        .li-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 11px;
            border-radius: 20px;
            white-space: nowrap
        }

        .li-badge.clear {
            background: var(--green-bg);
            color: var(--green)
        }

        .li-badge.warn {
            background: var(--amber-bg);
            color: var(--amber)
        }

        .li-badge.danger {
            background: var(--red-bg);
            color: var(--red)
        }

        /* DETAIL PANEL */
        .detail-panel {
            display: none
        }

        .detail-panel.show {
            display: block
        }

        .dp-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 20px;
            padding: 0;
            transition: color .15s
        }

        .dp-back:hover {
            color: var(--ink)
        }

        .dp-header {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r2);
            padding: 24px 28px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px
        }

        .dp-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px
        }

        .dp-sub {
            font-size: 12px;
            color: var(--muted)
        }

        .dp-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 10px
        }

        .dp-status.clear {
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid var(--green-line)
        }

        .dp-status.warn {
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid var(--amber-line)
        }

        .dp-status.danger {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid var(--red-line)
        }

        .dp-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0
        }

        .dp-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px
        }

        .dp-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 16px
        }

        .dp-card .lbl {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: 6px
        }

        .dp-card .val {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            line-height: 1
        }

        .dp-card .sub {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px
        }

        .dp-card.red {
            border-color: var(--red-line);
            background: var(--red-bg)
        }

        .dp-card.red .val {
            color: var(--red)
        }

        .dp-card.amber {
            border-color: var(--amber-line);
            background: var(--amber-bg)
        }

        .dp-card.amber .val {
            color: var(--amber)
        }

        .dp-card.green {
            border-color: var(--green-line);
            background: var(--green-bg)
        }

        .dp-card.green .val {
            color: var(--green)
        }

        .dp-card.blue {
            border-color: var(--blue-line);
            background: var(--blue-bg)
        }

        .dp-card.blue .val {
            color: var(--blue)
        }

        /* COMPLIANCE METER */
        .compliance-box {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r2);
            padding: 24px 28px;
            margin-bottom: 20px
        }

        .compliance-box h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink3);
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 18px
        }

        .meter-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px
        }

        .meter-label {
            font-size: 13px;
            color: var(--ink2);
            width: 130px;
            flex-shrink: 0
        }

        .meter-track {
            flex: 1;
            height: 8px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden
        }

        .meter-fill {
            height: 100%;
            border-radius: 4px;
            transition: width .8s cubic-bezier(.25, .8, .25, 1)
        }

        .meter-val {
            font-size: 13px;
            font-weight: 600;
            font-family: 'Space Mono', monospace;
            width: 48px;
            text-align: right;
            flex-shrink: 0
        }

        /* COMPLIANCE SCORE CIRCLE */
        .score-section {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-bottom: 20px;
            flex-wrap: wrap
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 6px solid;
        }

        .score-circle .sc-num {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            line-height: 1
        }

        .score-circle .sc-lbl {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px
        }

        .score-circle.A,
        .score-circle.B {
            border-color: var(--green);
            color: var(--green)
        }

        .score-circle.C {
            border-color: var(--amber);
            color: var(--amber)
        }

        .score-circle.D,
        .score-circle.F {
            border-color: var(--red);
            color: var(--red)
        }

        .grade-badge {
            font-size: 48px;
            font-weight: 700;
            font-family: 'Space Mono', monospace
        }

        .grade-badge.A,
        .grade-badge.B {
            color: var(--green)
        }

        .grade-badge.C {
            color: var(--amber)
        }

        .grade-badge.D,
        .grade-badge.F {
            color: var(--red)
        }

        .score-desc {
            font-size: 13px;
            color: var(--ink3);
            line-height: 1.7
        }

        /* PROXIMITY ROW */
        .prox-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line)
        }

        .prox-row:last-child {
            border-bottom: none
        }

        .prox-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0
        }

        /* EMPTY + NO-HISTORY */
        .no-history {
            background: var(--surface);
            border: 1px dashed var(--line2);
            border-radius: var(--r2);
            padding: 60px;
            text-align: center;
            color: var(--muted);
            font-size: 14px
        }

        .no-history a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 600
        }

        /* DELETE BTN */
        .del-btn {
            font-size: 12px;
            padding: 7px 14px;
            border: 1px solid var(--red-line);
            border-radius: 8px;
            background: none;
            color: var(--red);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: background .15s
        }

        .del-btn:hover {
            background: var(--red-bg)
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M8 1L14 4.5V11L8 14.5L2 11V4.5L8 1Z" stroke="white" stroke-width="1.5"
                        stroke-linejoin="round" />
                    <path d="M8 5L10.5 6.5V9.5L8 11L5.5 9.5V6.5L8 5Z" fill="white" />
                </svg>
            </div>
            SafeGuard
        </div>
        <a class="back-btn" href="/">← Back to Dashboard</a>
    </header>

    <div class="shell">

        <!-- LIST VIEW -->
        <div id="view-list">
            <div class="page-hd">
                <h1>Analysis History</h1>
                <p>Click any session to view the full breakdown.</p>
            </div>
            <div id="list-container"></div>
        </div>

        <!-- DETAIL VIEW -->
        <div class="detail-panel" id="view-detail">
            <button class="dp-back" onclick="showList()">← All analyses</button>
            <div id="detail-content"></div>
        </div>

    </div>

    <script>
        const HISTORY_KEY = 'safeguard_history';

        function loadHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
            catch { return []; }
        }

        function saveHistory(h) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
        }

        function getStatus(s) {
            if ((s.fire || 0) > 0 || (s.proximity_critical || 0) > 0) return { cls: 'danger', txt: 'Critical' };
            if ((s.ppe_violations || 0) > 0 || (s.proximity_high || 0) > 0) return { cls: 'warn', txt: 'Warning' };
            return { cls: 'clear', txt: 'All Clear' };
        }

        function complianceScore(s) {
            if (!s.frames) return { score: 100, grade: 'A' };
            // penalise: violations, proximity critical (double weight), fire
            const penalty = (s.ppe_violations || 0) + (s.proximity_critical || 0) * 2 + ((s.fire || 0) + (s.smoke || 0)) * 3;
            const raw = Math.max(0, 100 - Math.round((penalty / Math.max(s.frames, 1)) * 100));
            const score = Math.min(100, raw);
            let grade = 'A';
            if (score < 40) grade = 'F';
            else if (score < 55) grade = 'D';
            else if (score < 70) grade = 'C';
            else if (score < 85) grade = 'B';
            return { score, grade };
        }

        function formatTime(iso) {
            const t = new Date(iso);
            return t.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' })
                + ' · ' + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function shortName(fn) {
            return fn.replace(/^\d{8}_\d{6}_/, '');
        }

        // ── LIST VIEW ────────────────────────────────────────────────────────────────
        function showList() {
            document.getElementById('view-list').style.display = 'block';
            document.getElementById('view-detail').classList.remove('show');
            renderList();
        }

        function renderList() {
            const history = loadHistory();
            const container = document.getElementById('list-container');
            if (!history.length) {
                container.innerHTML = `<div class="no-history">
      No analyses recorded yet.<br>
      <a href="/">Go to the dashboard</a> and process an image or video first.
    </div>`;
                return;
            }
            container.innerHTML = `<div class="list-view">` + history.map(e => {
                const s = e.stats;
                const st = getStatus(s);
                const icon = e.ftype === 'image'
                    ? `<svg viewBox="0 0 24 24" fill="none" stroke="#1d5bdb" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`
                    : `<svg viewBox="0 0 24 24" fill="none" stroke="#c97c0a" stroke-width="1.8" stroke-linecap="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
                const iconCls = e.ftype === 'image' ? 'img' : 'vid';
                return `<div class="list-item" onclick="showDetail(${e.id})">
      <div class="li-icon ${iconCls}">${icon}</div>
      <div>
        <div class="li-name">${shortName(e.filename)}</div>
        <div class="li-time">${formatTime(e.timestamp)}</div>
      </div>
      <div class="li-stats">
        <div class="li-stat green"><div class="v">${s.frames}</div><div class="l">Frames</div></div>
        <div class="li-stat red"><div class="v">${s.ppe_violations}</div><div class="l">Violations</div></div>
        <div class="li-stat amber"><div class="v">${(s.fire || 0) + (s.smoke || 0)}</div><div class="l">Fire/Smoke</div></div>
        <div class="li-stat red"><div class="v">${s.proximity_critical || 0}</div><div class="l">Prox. Crit</div></div>
      </div>
      <span class="li-badge ${st.cls}">${st.txt}</span>
    </div>`;
            }).join('') + `</div>`;
        }

        // ── DETAIL VIEW ──────────────────────────────────────────────────────────────
        function showDetail(id) {
            const history = loadHistory();
            const entry = history.find(e => e.id === id);
            if (!entry) return;

            document.getElementById('view-list').style.display = 'none';
            document.getElementById('view-detail').classList.add('show');

            const s = entry.stats;
            const st = getStatus(s);
            const { score, grade } = complianceScore(s);

            const totalHazards = (s.fire || 0) + (s.smoke || 0);
            const violationRate = s.frames ? ((s.ppe_violations / s.frames) * 100).toFixed(1) : '0.0';
            const proxRate = s.frames ? (((s.proximity_critical || 0) / s.frames) * 100).toFixed(1) : '0.0';

            const gradeDesc = {
                A: 'Excellent compliance. Minimal to no safety violations detected across the session.',
                B: 'Good compliance. A small number of violations were recorded — review and address.',
                C: 'Moderate compliance. Notable violations detected. Immediate corrective action advised.',
                D: 'Poor compliance. Frequent violations and/or proximity events. High risk environment.',
                F: 'Critical. Widespread non-compliance or fire/smoke events detected. Halt operations.',
            };

            document.getElementById('detail-content').innerHTML = `
    <div class="dp-header">
      <div>
        <div class="dp-title">${shortName(entry.filename)}</div>
        <div class="dp-sub">${formatTime(entry.timestamp)} &middot; ${entry.ftype.charAt(0).toUpperCase() + entry.ftype.slice(1)}</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="dp-status ${st.cls}">
          <div class="dp-dot"></div>
          ${st.txt}
        </div>
        <button class="del-btn" onclick="deleteEntry(${entry.id})">Delete</button>
      </div>
    </div>

    <!-- Compliance Score -->
    <div class="compliance-box">
      <h3>Compliance Score</h3>
      <div class="score-section">
        <div class="score-circle ${grade}">
          <div class="sc-num">${score}</div>
          <div class="sc-lbl">/ 100</div>
        </div>
        <div class="grade-badge ${grade}">${grade}</div>
        <div class="score-desc">
          <b>Grade ${grade}</b> — ${gradeDesc[grade]}<br><br>
          Score is computed from violation rate, proximity-critical events (2× weight),
          and fire/smoke detections (3× weight) relative to total frames processed.
        </div>
      </div>

      <div class="meter-row">
        <div class="meter-label">PPE compliance</div>
        <div class="meter-track"><div class="meter-fill" style="width:${100 - parseFloat(violationRate)}%;background:var(--green)"></div></div>
        <div class="meter-val">${(100 - parseFloat(violationRate)).toFixed(1)}%</div>
      </div>
      <div class="meter-row">
        <div class="meter-label">Violation rate</div>
        <div class="meter-track"><div class="meter-fill" style="width:${Math.min(parseFloat(violationRate), 100)}%;background:var(--red)"></div></div>
        <div class="meter-val">${violationRate}%</div>
      </div>
      <div class="meter-row">
        <div class="meter-label">Prox. critical rate</div>
        <div class="meter-track"><div class="meter-fill" style="width:${Math.min(parseFloat(proxRate), 100)}%;background:var(--amber)"></div></div>
        <div class="meter-val">${proxRate}%</div>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="dp-grid">
      <div class="dp-card green">
        <div class="lbl">Frames</div>
        <div class="val">${s.frames}</div>
        <div class="sub">processed</div>
      </div>
      <div class="dp-card red">
        <div class="lbl">PPE Violations</div>
        <div class="val">${s.ppe_violations}</div>
        <div class="sub">non-compliant persons</div>
      </div>
      <div class="dp-card red">
        <div class="lbl">Prox. Critical</div>
        <div class="val">${s.proximity_critical || 0}</div>
        <div class="sub">worker near machinery</div>
      </div>
      <div class="dp-card amber">
        <div class="lbl">Prox. High</div>
        <div class="val">${s.proximity_high || 0}</div>
        <div class="sub">worker near hazard</div>
      </div>
      <div class="dp-card amber">
        <div class="lbl">Fire / Smoke</div>
        <div class="val">${totalHazards}</div>
        <div class="sub">hazard detections</div>
      </div>
      <div class="dp-card blue">
        <div class="lbl">Total Alerts</div>
        <div class="val">${s.total_alerts}</div>
        <div class="sub">logged events</div>
      </div>
    </div>

    <!-- Proximity breakdown -->
    <div class="compliance-box">
      <h3>Proximity Hazard Breakdown</h3>
      ${(s.proximity_critical || 0) === 0 && (s.proximity_high || 0) === 0
                    ? `<div style="font-size:13px;color:var(--muted);padding:8px 0">No proximity events detected in this session.</div>`
                    : `<div class="prox-row">
            <div class="prox-dot" style="background:var(--red)"></div>
            <div style="flex:1;font-size:13px;color:var(--ink2)">Critical — worker without PPE within close range of machinery/vehicle</div>
            <div style="font-size:16px;font-weight:700;font-family:'Space Mono',monospace;color:var(--red)">${s.proximity_critical || 0}</div>
          </div>
          <div class="prox-row">
            <div class="prox-dot" style="background:var(--amber)"></div>
            <div style="flex:1;font-size:13px;color:var(--ink2)">High — worker without PPE within extended range of machinery/vehicle</div>
            <div style="font-size:16px;font-weight:700;font-family:'Space Mono',monospace;color:var(--amber)">${s.proximity_high || 0}</div>
          </div>`
                }
    </div>
  `;
        }

        function deleteEntry(id) {
            if (!confirm('Delete this analysis record?')) return;
            const history = loadHistory().filter(e => e.id !== id);
            saveHistory(history);
            showList();
        }

        // ── INIT ─────────────────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            if (id) {
                showDetail(id);
            } else {
                showList();
            }
        });
    </script>
</body>

</html>
